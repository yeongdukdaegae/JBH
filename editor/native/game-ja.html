        const cv=t.ovCache||document.createElement('canvas');cv.width=Math.max(1,Math.ceil(rw));cv.height=Math.max(1,Math.ceil(rh));
        const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
        x.drawImage(img,sx,sy,rw,rh,0,0,rw,rh);
        x.globalCompositeOperation='source-in';x.fillStyle=ovCol;x.fillRect(0,0,rw,rh);   // 모양 (투명도) 은 그대로 · 색만 한 가지로
        x.globalCompositeOperation='source-over';t.ovCache=cv;t.ovKey=key;
        t.om=JBMEM.own(t.om,cv.width*cv.height*4,t,freeOv);
      }
      else if(t.om)t.om.t=JBMEM.n;
      src=t.ovCache;ssx=0;ssy=0;
    }
    else if(o.color.toLowerCase()!=='#ffffff'){
      const key=o.color+'|'+sx+'|'+sy+'|'+rw+'|'+rh+'|'+t.path;
      if(t.cacheKey!==key){
        const cv=t.cache||document.createElement('canvas');cv.width=Math.max(1,Math.ceil(rw));cv.height=Math.max(1,Math.ceil(rh));
        const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
        x.drawImage(img,sx,sy,rw,rh,0,0,rw,rh);
        x.globalCompositeOperation='multiply';x.fillStyle=o.color;x.fillRect(0,0,rw,rh);
        x.globalCompositeOperation='destination-in';x.drawImage(img,sx,sy,rw,rh,0,0,rw,rh);   // 투명한 곳은 그대로 투명
        x.globalCompositeOperation='source-over';t.cache=cv;t.cacheKey=key;
        t.cm=JBMEM.own(t.cm,cv.width*cv.height*4,t,freeTint);
      }
      else if(t.cm)t.cm.t=JBMEM.n;
      src=t.cache;ssx=0;ssy=0;
    }
    c.save();c.translate(o.pos.d[0],o.pos.d[1]);c.scale(t.x2<t.x1?-1:1,t.y2<t.y1?1:-1);   // 화면은 위쪽이 + 라서 한 번 뒤집어야 이미지가 바로 섬
    if(o.kind==='circle'){c.beginPath();c.ellipse(0,0,sw/2,sh/2,0,0,Math.PI*2);c.clip();}
    c.imageSmoothingEnabled=false;   // 성능 우선: 늘 픽셀 그대로
    c.drawImage(src,ssx,ssy,rw,rh,-sw/2,-sh/2,sw,sh);
    c.restore();
  }
  function fitCanvas(){
    geo=null;   // 크기가 바뀜 → 다시 잼
    if(el.hidden)return;
    const w=area.clientWidth,h=area.clientHeight,d=RES(),u=UN(),g=geom();
    last=[Math.round(w/u),Math.round(h/u)];   // 화면 크기 (단위) 는 영역 기준 그대로
    // 캔버스는 디스플레이 전체를 덮음 (위 막대 · 여백에서도 오브젝트가 보임)
    cv.style.left=-g.ox+'px';cv.style.top=-g.oy+'px';cv.style.right='auto';cv.style.bottom='auto';cv.style.width=g.EW+'px';cv.style.height=g.EH+'px';
    cv.width=Math.max(1,Math.round(g.EW*d));cv.height=Math.max(1,Math.round(g.EH*d));
    const c=C2();c.setTransform(d,0,0,-d,(g.ox+w/2)*d,(g.oy+h/2)*d);   // (0,0) = 화면 가운데, y 는 위로
    sizeEl.textContent=`[${last[0]}, ${last[1]}]`;   // 구석의 [screenX, screenY]
    paint();
  }
  addEventListener('resize',fitCanvas);
  if(window.visualViewport)visualViewport.addEventListener('resize',fitCanvas);
  return{
    open(){el.hidden=false;fitCanvas();const a=document.activeElement;if(a&&a.blur&&a!==document.body)a.blur();},
    close(){el.hidden=true;killTicker();if(!keysLive)keyClear();ptrs.clear();},
    isOpen(){return !el.hidden;},   // 내부 틱이 화면이 닫혔는지 확인
    screenScale(on){sizeEl.hidden=!on;},
    showColliders(on){showCol=!!on;},
    clicked(){return !el.hidden&&(pDown>0||fN<=tapF+1)?1:0;},
    frameNo(){return fN;},
    mouse(){return[mx,my];},
    mouseIn(){return !el.hidden&&mIn;},
    clicks(){return el.hidden?[]:clickLog;},
    key(n){if(el.hidden&&!keysLive)return 0;n=keyCanon(n);const t=keyTap.get(n);return keySet.has(n)||(t!==undefined&&fN<=t+1)?1:0;},
    keysOn(b){keysLive=!!b;if(!b&&el.hidden)keyClear();},
    pointers(){return el.hidden?[]:[...ptrs.values()];},
    ptrLog(){return el.hidden?[]:ptrLog;},   // 포인터 누름 · 움직임 · 뗌 기록
    ptrNow(){return el.hidden?[]:[...ptrs].map(([id,q])=>[id,q[0],q[1]]);},   // 지금 누르고 있는 포인터 [id, x, y]
    size(){if(!el.hidden){const g=geom();last=[Math.round(g.w/g.u),Math.round(g.h/g.u)];}return last;},   // 화면 단위
    color(h){if(h!==bgNow){bgNow=h;el.style.background=h;if(!el.hidden)paint();}if(!logoEl.hidden)logoEl.hidden=true;},   // 같은 값이면 DOM 을 건드리지 않음 · 캔버스 배경도 다시 칠함   // 색을 바꾸면 로고는 사라짐
    setupObject(){el.dataset.objects='on';},
    measure(t,size){mctx.font=TEXT_FONT(size/fontK().k);return mctx.measureText(String(t)).width;},   // 크기 = 글자 높이 → 글꼴 크기 = 크기 / k
    setFont(dataUrl){   // .ttf 를 읽어 글꼴로 등록 (다 읽으면 끝)
      const fam='jbFont'+(++fontN);
      return jbDataBuf(dataUrl).then(b=>new FontFace(fam,b).load()).then(f=>{document.fonts.add(f);userFont=fam;});
    },
    loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res({img:im,w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>rej(new Error('image'));im.src=src;});},
    draw(list,inFrame){   // 바뀐 것은 바로 그림 — 다음 프레임까지 기다리지 않음 (키 입력 → 화면 지연 1 프레임 줄임)
      objs=list;if(list.length&&!logoEl.hidden)logoEl.hidden=true;   // 이미 숨겼으면 매 프레임 건드리지 않음
      if(inFrame)return;
      const ft=frameT();
      if(paintedT===ft){if(!rq)rq=requestAnimationFrame(frame);return;}   // 이 프레임에 이미 그렸으면 다음 프레임에 (한 프레임에 한 번만)
      if(rq&&rqT!==ft)return;   // 이번 프레임 그리기가 아직 남아 있음
      paint();
    },
    setTicker(fn){ticker=fn;if(!rq){tickLast=performance.now();rq=requestAnimationFrame(frame);}},
    reset(){/*DEV-START*/if(typeof JBEXT!=='undefined')JBEXT.kept=[];/*DEV-END*/userFont='';killTicker();showCol=false;pDown=0;tapF=-9;mx=0;my=0;mIn=false;sizeEl.hidden=false;el.hidden=true;el.style.background='#000';bgNow='#000';logoEl.hidden=false;geo=null;delete el.dataset.objects;last=[0,0];objs=[];
      const c=C2();c.setTransform(1,0,0,1,0,0);c.fillStyle='#000';c.fillRect(0,0,cv.width,cv.height);}
  };
})();
/*DISUI-END*/
function showErr(e){   // 오류만 화면 아래에 작게
  const m=e instanceof JBError?`✖ ${e.file?e.file+':'+e.line+'  ':''}${tr(e.message)}`:tr('✖ 내부 오류: '+(e&&e.message||e));
  const b=$('#jberr');b.textContent=m;b.hidden=false;console.error(m);
}
// genJson 으로 만든 파일(세이브 등)은 이 실행 파일의 저장 공간에 둠 — 내려받지 않음 · 다음에 열어도 loadJson · fileExists 가 그대로 읽음
//   (같은 기기 · 같은 브라우저에서 · 게임 이름별로 따로)
const SAVE_KEY='jb-game:'+(PROJECT.name||'game')+':';
function savedFiles(){
  const o={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(SAVE_KEY))o[k.slice(SAVE_KEY.length)]=localStorage.getItem(k);}}catch(e){}
  return o;
}
function keepFile(p,t){
  try{localStorage.setItem(SAVE_KEY+p,t);}
  catch(e){showErr(new Error('세이브를 저장하지 못했습니다 (저장 공간이 꽉 찼거나 막혀 있음): '+p));}
}
async function run(){
  let prog;
  try{prog=buildProgram(Object.assign({},PROJECT.files,savedFiles()),PROJECT.main);}catch(e){showErr(e);return;}   // 저장해 둔 파일이 원래 파일보다 먼저
  const ctl={stop:false,t0:performance.now(),last:performance.now()};
  try{
    await execProgram(prog,{/*DEV-START*/extGrant:new Set(PROJECT.extGrant||[]),extNet:new Set(PROJECT.extNet||[]),/*DEV-END*/log:t=>console.log(t),dis:disUI,writeFile:(p,t)=>keepFile(p,t)},ctl);
  }catch(e){if(e!==STOP&&e!==TERM)showErr(e);}
}
addEventListener('pagehide',()=>{try{sndStopAll();}catch(e){}});
document.title=PROJECT.name||'Jawbreaker';
document.documentElement.lang=typeof LANG==='string'?LANG:'ko';
run();

</script>
