# GitHub 가 Windows 에서 빌드해 설치 파일을 만들어 줍니다 (PC 없이도 됨).
#   저장소의 Actions 탭 → "JDH build" → Run workflow → 끝나면 아래 Artifacts 에서 JDH-Setup 을 받습니다.
name: JDH build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: llvm-mingw 받기
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like '*ucrt-x86_64.zip' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mingw.zip
          Expand-Archive mingw.zip -DestinationPath mingw
          $dir = (Get-ChildItem mingw -Directory | Select-Object -First 1).FullName
          "MINGW=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 빌드
        shell: cmd
        run: build-win.bat
      - name: 라이브러리용 컴파일러 (zig) 넣기
        shell: cmd
        run: |
          python -m pip install ziglang -t zigpkg --no-deps -q
          if not exist dist\toolchain mkdir dist\toolchain
          xcopy /e /i /q /y zigpkg\ziglang dist\toolchain\zig >nul
          dist\toolchain\zig\zig.exe version
      - name: 명령 시험 (틀 만들기 → C 를 컴파일해 굽기 → 프로젝트에 적용)
        shell: cmd
        run: |
          set JDH_HOME=
          dist\bin\jdh.exe version
          dist\bin\jdh.exe new lib Hello
          dist\bin\jdh.exe lib build Hello
          dist\bin\jdh.exe new project Game
          dist\bin\jdh.exe lib add Hello\Hello-0.1.0.jbx Game
          dist\bin\jdh.exe lib list Game
      - name: SDL2 (실행기용) 넣기
        shell: pwsh
        run: |
          $rels = Invoke-RestMethod "https://api.github.com/repos/libsdl-org/SDL/releases?per_page=60"
          $asset = $rels | Where-Object { $_.tag_name -like 'release-2.*' } | ForEach-Object { $_.assets } | Where-Object { $_.name -like 'SDL2-devel-*-mingw.zip' } | Select-Object -First 1
          Write-Host $asset.name
          Invoke-WebRequest $asset.browser_download_url -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath sdl
          $src = (Get-ChildItem sdl -Directory | Select-Object -First 1).FullName + "\x86_64-w64-mingw32"
          New-Item -ItemType Directory -Force dist\sdk\SDL2 | Out-Null
          Copy-Item "$src\include" dist\sdk\SDL2\include -Recurse
          New-Item -ItemType Directory -Force dist\sdk\SDL2\lib | Out-Null
          Copy-Item "$src\lib\libSDL2.a" dist\sdk\SDL2\lib\
      - name: EXE 시험 (라이브러리를 쓰는 프로젝트를 실행 파일로 만들어 실제로 실행)
        shell: cmd
        run: |
          set JDH_HOME=
          (echo Use jawbreaker call jaw;& echo Use Hello call h;& echo.& echo run{& echo     h.hello^("one"^);& echo     h.hello^("two"^);& echo     print^("count=%%h.count%%"^);& echo }) > Game\main.jb
          type Game\main.jb
          dist\bin\jdh.exe build exe Game -o Game.exe || exit /b 1
          set SDL_VIDEODRIVER=dummy
          set SDL_AUDIODRIVER=dummy
          Game.exe > out.txt 2> err.txt
          echo exit=%errorlevel%
          type out.txt
          type err.txt
          findstr /c:"count=2" out.txt || exit /b 1
      - name: EXE 결과물 시험 (크기 · 아이콘 · 고해상도 화면 설정)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          $bad = 0
          $b = [IO.File]::ReadAllBytes("$PWD\Game.exe"); $t = [Text.Encoding]::GetEncoding(28591).GetString($b)
          Write-Host ("Game.exe {0:N1} MB" -f ($b.Length / 1MB))
          if ($t.IndexOf('PerMonitorV2') -lt 0) { Write-Host '✖ 고해상도 화면 설정 (manifest) 이 없습니다'; $bad++ }
          if (Test-Path Game.pdb) { Write-Host '✖ Game.pdb 가 남았습니다'; $bad++ }
          # 아이콘: 기본 아이콘이 들어갔는지 · 프로젝트의 icon.ico 로 바뀌는지 (Windows 가 실행 파일에서 아이콘을 꺼내 줌)
          Add-Type -AssemblyName System.Drawing
          $i1 = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\Game.exe")
          if (-not $i1) { Write-Host '✖ 아이콘이 없습니다'; $bad++ }
          $bmp = New-Object System.Drawing.Bitmap 32, 32
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.Clear([System.Drawing.Color]::FromArgb(255, 255, 0, 255)); $g.Dispose()
          $fs = [IO.File]::Create("$PWD\Game\icon.ico"); [System.Drawing.Icon]::FromHandle($bmp.GetHicon()).Save($fs); $fs.Close()
          dist\bin\jdh.exe build exe Game -o GameIcon.exe; if ($LASTEXITCODE) { exit 1 }
          $px = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\GameIcon.exe").ToBitmap().GetPixel(16, 16)
          Write-Host "프로젝트 아이콘의 가운데 색: $px"
          if (-not ($px.R -gt 200 -and $px.G -lt 60 -and $px.B -gt 200)) { Write-Host '✖ 프로젝트의 icon.ico 가 쓰이지 않았습니다'; $bad++ }
          Remove-Item Game\icon.ico
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\GameIcon.exe -RedirectStandardOutput gi-out.txt -RedirectStandardError gi-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          if (-not (Select-String -Path gi-out.txt -SimpleMatch 'count=2' -Quiet)) { Write-Host '✖ 줄인 실행 파일이 제대로 실행되지 않았습니다'; Get-Content gi-err.txt; $bad++ }
          if ($bad) { exit 1 }
      - name: 엔진 기능 시험 (그리기 · 오브젝트 · 파일 — 웹 시험 tests/dev.mjs 와 같은 main.jb · 같은 결과)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe lib build tests\libs\Probe; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib check tests\libs\NoPerm
          if ($LASTEXITCODE -eq 0) { Write-Error '권한 없이 엔진 기능을 쓰는 라이브러리가 검사를 통과했습니다'; exit 1 }
          dist\bin\jdh.exe new project ProbeGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Probe\Probe-0.1.0.jbx ProbeGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\probe-main.jb ProbeGame\main.jb -Force
          Copy-Item tests\fixtures\probe-data.txt ProbeGame\data.txt -Force
          dist\bin\jdh.exe build exe ProbeGame -o Probe.exe; if ($LASTEXITCODE) { exit 1 }
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\Probe.exe -ArgumentList '--shot','probe-exe.png','--shot-at','4000' -RedirectStandardOutput probe-out.txt -RedirectStandardError probe-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          Get-Content probe-out.txt -Encoding utf8; Get-Content probe-err.txt -Encoding utf8
          $expect = @('look exists=1 px=10 py=20 sw=80 color=#5c68ff text=-', 'nope exists=0 color=-', 'lbl text=hello',
            'after pos=[100, -50] color=#ff8800 text=bye scale=[40, 40]', 'file size=18 head=line one/line two/', 'ext size=-1', 'follow tail=[200, -50] frames>0=')
          $bad = 0
          foreach ($e in $expect) { if (-not (Select-String -Path probe-out.txt -SimpleMatch $e -Quiet)) { Write-Host "✖ 없음: $e"; $bad++ } }
          if (-not (Test-Path probe-exe.png)) { Write-Host '✖ 화면을 저장하지 못했습니다 (probe-exe.png)'; $bad++ }
          if ($bad) { exit 1 }
      - name: 리스트 · 행렬 인자 시험 (웹 시험 tests/dev.mjs 와 같은 main.jb · 같은 줄 · 같은 오류)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe lib build tests\libs\Lists; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe new project ListsGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Lists\Lists-0.1.0.jbx ListsGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\lists-main.jb ListsGame\main.jb -Force
          dist\bin\jdh.exe build exe ListsGame -o Lists.exe; if ($LASTEXITCODE) { exit 1 }
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\Lists.exe -RedirectStandardOutput lists-out.txt -RedirectStandardError lists-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          Get-Content lists-out.txt -Encoding utf8; Get-Content lists-err.txt -Encoding utf8
          $expect = @('isum n=3 sum=5 total=5', 'isum n=0 sum=0', 'fsum n=3 sum=4 n=3', 'join n=3:a|bc|한글', 'bits 10101', 'pair 7 seven',
            'mix t 1.5 -2 3 9', 'mat 1 2 3 4 5 6', 'anymat 3x2 sum=21 last=6', 'rowmat rows=3 (1,2) (3,4) (5,6)', 'isum n=20000 sum=200010000')
          $bad = 0
          foreach ($e in $expect) { if (-not (Select-String -Path lists-out.txt -SimpleMatch $e -Quiet -Encoding utf8)) { Write-Host "✖ 없음: $e"; $bad++ } }
          # 실행 중 오류: 항목 형식이 틀린 리스트 → 그 줄에서 멈춤 (웹과 같은 문구)
          Set-Content ListsGame\main.jb -Encoding utf8NoBOM -Value "Use jawbreaker call jaw;`nUse Lists call L;`n`nrun{`n    var list call xs; xs = [`"x`", 2]; L.join(xs);`n}`n"
          dist\bin\jdh.exe build exe ListsGame -o ListsErr.exe; if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process .\ListsErr.exe -RedirectStandardOutput lerr-out.txt -RedirectStandardError lerr-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          Get-Content lerr-err.txt -Encoding utf8
          $want = "main.jb:5  'join' 의 1번째 값의 2번째 항목은 string 형식이어야 합니다 (받은 값: 2)"
          if ($p.ExitCode -eq 0 -or -not (Select-String -Path lerr-err.txt -SimpleMatch $want -Quiet -Encoding utf8)) { Write-Host "✖ 오류 문구가 다릅니다 (기대: $want)"; $bad++ }
          if ($bad) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JDH-test-screens
          path: probe-exe.png
          if-no-files-found: ignore
      - name: 설치 파일 만들기
        shell: cmd
        run: |
          where iscc >nul 2>nul || choco install innosetup -y --no-progress
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\jdh.iss
      - uses: actions/upload-artifact@v4
        with:
          name: JDH-Setup
          path: installer/out/*.exe
