# GitHub 가 Windows 에서 빌드해 설치 파일을 만들어 줍니다 (PC 없이도 됨).
#   저장소의 Actions 탭 → "JDH build" → Run workflow → 끝나면 아래 Artifacts 에서 JDH-Setup 을 받습니다.
name: JDH build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']   # 버전 태그 (v0.6.0 꼴) 를 올리면 빌드 · 시험 뒤 릴리스로 게시 → 설치된 JDH 가 새 버전으로 알아봄
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # 릴리스 게시 (태그일 때만 씀)
    steps:
      - uses: actions/checkout@v4
      - name: llvm-mingw 받기
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like '*ucrt-x86_64.zip' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mingw.zip
          Expand-Archive mingw.zip -DestinationPath mingw
          $dir = (Get-ChildItem mingw -Directory | Select-Object -First 1).FullName
          "MINGW=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 빌드
        shell: cmd
        run: build-win.bat
      - name: 라이브러리용 컴파일러 (zig) 넣기
        shell: cmd
        run: |
          python -m pip install ziglang -t zigpkg --no-deps -q
          if not exist dist\toolchain mkdir dist\toolchain
          xcopy /e /i /q /y zigpkg\ziglang dist\toolchain\zig >nul
          dist\toolchain\zig\zig.exe version
      - name: 명령 시험 (틀 만들기 → C 를 컴파일해 굽기 → 프로젝트에 적용)
        shell: cmd
        run: |
          set JDH_HOME=
          dist\bin\jdh.exe version
          dist\bin\jdh.exe new lib Hello
          dist\bin\jdh.exe lib build Hello
          dist\bin\jdh.exe new project Game
          dist\bin\jdh.exe lib add Hello\Hello-0.1.0.jbx Game
          dist\bin\jdh.exe lib list Game
      - name: SDL2 (실행기용) 넣기
        shell: pwsh
        run: |
          $rels = Invoke-RestMethod "https://api.github.com/repos/libsdl-org/SDL/releases?per_page=60"
          $asset = $rels | Where-Object { $_.tag_name -like 'release-2.*' } | ForEach-Object { $_.assets } | Where-Object { $_.name -like 'SDL2-devel-*-mingw.zip' } | Select-Object -First 1
          Write-Host $asset.name
          Invoke-WebRequest $asset.browser_download_url -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath sdl
          $src = (Get-ChildItem sdl -Directory | Select-Object -First 1).FullName + "\x86_64-w64-mingw32"
          New-Item -ItemType Directory -Force dist\sdk\SDL2 | Out-Null
          Copy-Item "$src\include" dist\sdk\SDL2\include -Recurse
          New-Item -ItemType Directory -Force dist\sdk\SDL2\lib | Out-Null
          Copy-Item "$src\lib\libSDL2.a" dist\sdk\SDL2\lib\
      - name: EXE 시험 (라이브러리를 쓰는 프로젝트를 실행 파일로 만들어 실제로 실행)
        shell: cmd
        run: |
          set JDH_HOME=
          (echo Use jawbreaker call jaw;& echo Use Hello call h;& echo.& echo run{& echo     h.hello^("one"^);& echo     h.hello^("two"^);& echo     print^("count=%%h.count%%"^);& echo }) > Game\main.jb
          type Game\main.jb
          dist\bin\jdh.exe build exe Game -o Game.exe || exit /b 1
          set SDL_VIDEODRIVER=dummy
          set SDL_AUDIODRIVER=dummy
          Game.exe > out.txt 2> err.txt
          echo exit=%errorlevel%
          type out.txt
          type err.txt
          findstr /c:"count=2" out.txt || exit /b 1
      - name: EXE 결과물 시험 (크기 · 아이콘 · 고해상도 화면 설정)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          $bad = 0
          $b = [IO.File]::ReadAllBytes("$PWD\Game.exe"); $t = [Text.Encoding]::GetEncoding(28591).GetString($b)
          Write-Host ("Game.exe {0:N1} MB" -f ($b.Length / 1MB))
          if ($t.IndexOf('PerMonitorV2') -lt 0) { Write-Host '✖ 고해상도 화면 설정 (manifest) 이 없습니다'; $bad++ }
          if (Test-Path Game.pdb) { Write-Host '✖ Game.pdb 가 남았습니다'; $bad++ }
          # 아이콘: 기본 아이콘이 들어갔는지 · 프로젝트의 icon.ico 로 바뀌는지 (Windows 가 실행 파일에서 아이콘을 꺼내 줌)
          Add-Type -AssemblyName System.Drawing
          $i1 = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\Game.exe")
          if (-not $i1) { Write-Host '✖ 아이콘이 없습니다'; $bad++ }
          $bmp = New-Object System.Drawing.Bitmap 32, 32
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.Clear([System.Drawing.Color]::FromArgb(255, 255, 0, 255)); $g.Dispose()
          $fs = [IO.File]::Create("$PWD\Game\icon.ico"); [System.Drawing.Icon]::FromHandle($bmp.GetHicon()).Save($fs); $fs.Close()
          dist\bin\jdh.exe build exe Game -o GameIcon.exe; if ($LASTEXITCODE) { exit 1 }
          $px = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\GameIcon.exe").ToBitmap().GetPixel(16, 16)
          Write-Host "프로젝트 아이콘의 가운데 색: $px"
          if (-not ($px.R -gt 200 -and $px.G -lt 60 -and $px.B -gt 200)) { Write-Host '✖ 프로젝트의 icon.ico 가 쓰이지 않았습니다'; $bad++ }
          Remove-Item Game\icon.ico
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\GameIcon.exe -RedirectStandardOutput gi-out.txt -RedirectStandardError gi-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          if (-not (Select-String -Path gi-out.txt -SimpleMatch 'count=2' -Quiet)) { Write-Host '✖ 줄인 실행 파일이 제대로 실행되지 않았습니다'; Get-Content gi-err.txt; $bad++ }
          if ($bad) { exit 1 }
      - name: 엔진 기능 시험 (그리기 · 오브젝트 · 파일 — 웹 시험 tests/dev.mjs 와 같은 main.jb · 같은 결과)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe lib build tests\libs\Probe; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib check tests\libs\NoPerm
          if ($LASTEXITCODE -eq 0) { Write-Error '권한 없이 엔진 기능을 쓰는 라이브러리가 검사를 통과했습니다'; exit 1 }
          dist\bin\jdh.exe new project ProbeGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Probe\Probe-0.1.0.jbx ProbeGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\probe-main.jb ProbeGame\main.jb -Force
          Copy-Item tests\fixtures\probe-data.txt ProbeGame\data.txt -Force
          dist\bin\jdh.exe build exe ProbeGame -o Probe.exe; if ($LASTEXITCODE) { exit 1 }
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\Probe.exe -ArgumentList '--shot','probe-exe.png','--shot-at','4000' -RedirectStandardOutput probe-out.txt -RedirectStandardError probe-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          Get-Content probe-out.txt -Encoding utf8; Get-Content probe-err.txt -Encoding utf8
          $expect = @('look exists=1 px=10 py=20 sw=80 color=#5c68ff text=-', 'nope exists=0 color=-', 'lbl text=hello',
            'after pos=[100, -50] color=#ff8800 text=bye scale=[40, 40]', 'file size=18 head=line one/line two/', 'ext size=-1', 'follow tail=[200, -50] frames>0=')
          $bad = 0
          foreach ($e in $expect) { if (-not (Select-String -Path probe-out.txt -SimpleMatch $e -Quiet)) { Write-Host "✖ 없음: $e"; $bad++ } }
          if (-not (Test-Path probe-exe.png)) { Write-Host '✖ 화면을 저장하지 못했습니다 (probe-exe.png)'; $bad++ }
          if ($bad) { exit 1 }
      - name: 리스트 · 행렬 인자 시험 (웹 시험 tests/dev.mjs 와 같은 main.jb · 같은 줄 · 같은 오류)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe lib build tests\libs\Lists; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe new project ListsGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Lists\Lists-0.1.0.jbx ListsGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\lists-main.jb ListsGame\main.jb -Force
          dist\bin\jdh.exe build exe ListsGame -o Lists.exe; if ($LASTEXITCODE) { exit 1 }
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\Lists.exe -RedirectStandardOutput lists-out.txt -RedirectStandardError lists-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          Get-Content lists-out.txt -Encoding utf8; Get-Content lists-err.txt -Encoding utf8
          $expect = @('isum n=3 sum=5 total=5', 'isum n=0 sum=0', 'fsum n=3 sum=4 n=3', 'join n=3:a|bc|한글', 'bits 10101', 'pair 7 seven',
            'mix t 1.5 -2 3 9', 'mat 1 2 3 4 5 6', 'anymat 3x2 sum=21 last=6', 'rowmat rows=3 (1,2) (3,4) (5,6)', 'isum n=20000 sum=200010000')
          $bad = 0
          foreach ($e in $expect) { if (-not (Select-String -Path lists-out.txt -SimpleMatch $e -Quiet -Encoding utf8)) { Write-Host "✖ 없음: $e"; $bad++ } }
          # 실행 중 오류: 항목 형식이 틀린 리스트 → 그 줄에서 멈춤 (웹과 같은 문구)
          Set-Content ListsGame\main.jb -Encoding utf8NoBOM -Value "Use jawbreaker call jaw;`nUse Lists call L;`n`nrun{`n    var list call xs; xs = [`"x`", 2]; L.join(xs);`n}`n"
          dist\bin\jdh.exe build exe ListsGame -o ListsErr.exe; if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process .\ListsErr.exe -RedirectStandardOutput lerr-out.txt -RedirectStandardError lerr-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          Get-Content lerr-err.txt -Encoding utf8
          $want = "main.jb:5  'join' 의 1번째 값의 2번째 항목은 string 형식이어야 합니다 (받은 값: 2)"
          if ($p.ExitCode -eq 0 -or -not (Select-String -Path lerr-err.txt -SimpleMatch $want -Quiet -Encoding utf8)) { Write-Host "✖ 오류 문구가 다릅니다 (기대: $want)"; $bad++ }
          if ($bad) { exit 1 }
      - name: 그리기 층 시험 (jdh_draw_layer — 자체 · 오브젝트 레이어 · UI · 웹 시험과 같은 main.jb · 화면의 색으로 순서를 확인)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe lib build tests\libs\Layers; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe new project LayersGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Layers\Layers-0.1.0.jbx LayersGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\layers-main.jb LayersGame\main.jb -Force
          dist\bin\jdh.exe build exe LayersGame -o Layers.exe; if ($LASTEXITCODE) { exit 1 }
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\Layers.exe -ArgumentList '--shot','layers-exe.png','--shot-at','2000' -RedirectStandardOutput layers-out.txt -RedirectStandardError layers-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          Get-Content layers-out.txt -Encoding utf8; Get-Content layers-err.txt -Encoding utf8
          if (-not (Test-Path layers-exe.png)) { Write-Host '✖ 화면을 저장하지 못했습니다'; exit 1 }
          # 화면 가운데 기준 (화면 단위 · 위쪽이 +) 의 점마다 기대하는 색 — 카메라가 [50, 0] 이라 세계는 왼쪽으로 50
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap "$PWD\layers-exe.png"; $u = $bmp.Height / 720.0
          $pts = @(@(-50, -40, 255, 255, 255, '흰색 (레이어 5 오브젝트 — 빨강 위)'), @(-115, 0, 255, 0, 0, '빨강 (오브젝트 층 2 — 회색 위 · 흰색 아래)'), @(-140, 0, 128, 128, 128, '회색 (레이어 0 오브젝트 — 파랑 위)'),
                   @(-180, 0, 0, 0, 255, '파랑 (오브젝트 층 -1 — 모든 오브젝트 아래)'), @(-20, 30, 0, 255, 0, '초록 (자체 층 — 오브젝트 위)'), @(-200, 150, 255, 255, 0, '노랑 (UI 층 — 화면에 고정)'))
          $bad = 0
          foreach ($q in $pts) {
            $c = $bmp.GetPixel([int]($bmp.Width / 2 + $q[0] * $u), [int]($bmp.Height / 2 - $q[1] * $u))
            if ([Math]::Abs($c.R - $q[2]) -gt 24 -or [Math]::Abs($c.G - $q[3]) -gt 24 -or [Math]::Abs($c.B - $q[4]) -gt 24) { Write-Host "✖ $($q[5]): ($($c.R), $($c.G), $($c.B))"; $bad++ }
          }
          $bmp.Dispose()
          if ($bad) { exit 1 }
      - name: 네트워크 시험 (HTTP · WebSocket — 웹 시험과 같은 main.jb · 같은 줄 · tests/net_server.py 에 접속)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe lib build tests\libs\Net; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe new project NetGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Net\Net-0.1.0.jbx NetGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\net-main.jb NetGame\main.jb -Force
          dist\bin\jdh.exe build exe NetGame -o Net.exe; if ($LASTEXITCODE) { exit 1 }
          $srv = Start-Process python -ArgumentList 'tests\net_server.py','8770','8771' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $bad = 0
          try {
            $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
            $p = Start-Process .\Net.exe -RedirectStandardOutput net-out.txt -RedirectStandardError net-err.txt -PassThru
            if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host '✖ 90초 안에 끝나지 않았습니다'; $bad++ }
            Get-Content net-out.txt -Encoding utf8; Get-Content net-err.txt -Encoding utf8
            $expect = @('get status=200 size=9 body=hello net', 'post status=200 body=tag7:한글 body', 'missing status=404 body=nope', 'big status=200 size=200000 sum=995134', 'refused status=0', 'badurl started=0 status=0',
              'ws state=1 msgs=welcome', 'ws n=3 msgs=welcome|echo:one|echo:둘', 'ws closed by server state=2', 'ws refused state=-1')
            foreach ($e in $expect) { if (-not (Select-String -Path net-out.txt -SimpleMatch $e -Quiet -Encoding utf8)) { Write-Host "✖ 없음: $e"; $bad++ } }
          } finally { Stop-Process -Id $srv.Id -Force }
          if ($bad) { exit 1 }
      - name: 서버 시험 (server — HTTP · WebSocket 을 받아 답함 · compound 값 · Net 라이브러리로 자기 자신에 접속)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe lib build tests\libs\Net; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib build tests\libs\Server; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe new project SrvGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Net\Net-0.1.0.jbx SrvGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Server\Server-0.1.0.jbx SrvGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\server-main.jb SrvGame\main.jb -Force
          dist\bin\jdh.exe build exe SrvGame -o Srv.exe; if ($LASTEXITCODE) { exit 1 }
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\Srv.exe -ArgumentList '--no-box' -RedirectStandardOutput srv-out.txt -RedirectStandardError srv-err.txt -PassThru
          $bad = 0
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host '✖ 90초 안에 끝나지 않았습니다'; $bad++ }
          Get-Content srv-out.txt -Encoding utf8; Get-Content srv-err.txt -Encoding utf8
          $all = (Get-Content srv-out.txt -Encoding utf8) + (Get-Content srv-err.txt -Encoding utf8)
          $expect = @('info0=[0, 0, [], 1, 0, "한글"]', 'one=[5] empty=[]', 'server port=8790', 'get status=200 body=hi GET', 'post status=200 body=tag7:한글 body last=POST /echo 11',
            'missing status=404 body=nope', 'ws state=1 msgs=welcome path=/chat', 'ws n=3 msgs=welcome|echo:one|echo:둘', 'ws closed by server state=2 got=one|둘|bye',
            'info=[1, 3, ["/hello", "/echo", "/missing?x=1"], 1, 0, "한글"]', 'after stop status=0', 'relisten port=8790', "라이브러리 'Server' 의 값 'bad' 에 { } (객체)가 있습니다")
          foreach ($e in $expect) { if (-not ($all | Where-Object { $_.Contains($e) })) { Write-Host "✖ 없음: $e"; $bad++ } }
          if ($bad) { exit 1 }
      - name: https · wss 서버 시험 (jdh_srv_listen_tls · SChannel — 스스로 서명한 인증서 · 엔진의 클라이언트 (WinHTTP) 와 Python 으로 접속)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe new project TlsGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Net\Net-0.1.0.jbx TlsGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe lib add tests\libs\Server\Server-0.1.0.jbx TlsGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\server-tls-main.jb TlsGame\main.jb -Force
          # 시험용 인증서: localhost · 이 PC 의 신뢰할 루트에 넣어 WinHTTP 가 받아들이게
          $cert = New-SelfSignedCertificate -DnsName localhost -CertStoreLocation Cert:\LocalMachine\My -KeyExportPolicy Exportable -KeyAlgorithm RSA -KeyLength 2048 -NotAfter (Get-Date).AddDays(2)
          New-Item -ItemType Directory TlsGame\cert -Force | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath TlsGame\cert\server.pfx -Password (ConvertTo-SecureString 'jdh-test' -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath tls.cer | Out-Null
          Import-Certificate -FilePath tls.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          dist\bin\jdh.exe build exe TlsGame -o Tls.exe; if ($LASTEXITCODE) { exit 1 }
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\Tls.exe -ArgumentList '--no-box' -RedirectStandardOutput tls-out.txt -RedirectStandardError tls-err.txt -PassThru
          $bad = 0
          Start-Sleep -Seconds 12
          $py = python tests\tls_client.py 8792 2>&1; $py | ForEach-Object { Write-Host "  $_" }
          $cu = curl.exe -sk --max-time 10 https://127.0.0.1:8792/hello; Write-Host "  curl: $cu"
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host '✖ 90초 안에 끝나지 않았습니다'; $bad++ }
          Get-Content tls-out.txt -Encoding utf8; Get-Content tls-err.txt -Encoding utf8
          $all = (Get-Content tls-out.txt -Encoding utf8) + (Get-Content tls-err.txt -Encoding utf8)
          $expect = @('tls missing port=0', 'tls badpw port=0', 'tls port=8792', 'https status=200 body=hi GET', 'https post status=200 body=tag9:암호 body', 'plain to tls status=0',
            'wss state=1 msgs=welcome|echo:one|echo:둘 path=/secure', 'wss closed state=2', 'tls done n=')
          foreach ($e in $expect) { if (-not ($all | Where-Object { $_.Contains($e) })) { Write-Host "✖ 없음: $e"; $bad++ } }
          if (-not ($py | Where-Object { "$_".StartsWith('py https=HTTP/1.1 200 OK body=hi GET tls=TLSv1.') })) { Write-Host '✖ Python https'; $bad++ }
          if (-not ($py | Where-Object { "$_" -eq 'py wss=HTTP/1.1 101 Switching Protocols first=welcome echo=132' })) { Write-Host '✖ Python wss'; $bad++ }
          if ($cu -ne 'hi GET') { Write-Host '✖ curl https'; $bad++ }
          if ($bad) { exit 1 }
      - name: data 형식 시험 (넣기 · 꺼내기 · 안 맞으면 건너뜀 — 웹 시험과 같은 main.jb · 같은 줄)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe new project DataGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\data-main.jb DataGame\main.jb -Force
          dist\bin\jdh.exe build exe DataGame -o Data.exe; if ($LASTEXITCODE) { exit 1 }
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\Data.exe -RedirectStandardOutput data-out.txt -RedirectStandardError data-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          Get-Content data-out.txt -Encoding utf8; Get-Content data-err.txt -Encoding utf8
          $expect = @('d=406fe00000000000', 'n=255', 's=6869', 't=hi', 'k=7', 'k2=0', 'bad=keep', 'fd=3fe0000000000000 b=1 f2=0.5', 'md=5b5b312c325d2c5b332c345d5d',
            'm2=[1, 2 | 3, 4]', 'm3=[0 | 0 | 0]', 'ls=[1,"x",3] l2=[1, "x", 3]', 'c2=[1, "a", [2, 3]]', 'l3=[9]', 'e=[]',
            'big=3031323334353637383930313233343536373839303132333435363738393031… (70 B)', 'd2=406fe00000000000 d=7a', 'three=0', 'lb=[1, 0, 2]')
          $got = Get-Content data-out.txt -Encoding utf8; $bad = 0
          foreach ($e in $expect) { if ($got -notcontains $e) { Write-Host "✖ 없음: $e"; $bad++ } }
          if ($bad) { exit 1 }
      - name: data 일부 고치기 · 파일 시험 (getPart · setPart · copyFileData · overWriteFile — 웹 시험과 같은 main.jb · 같은 줄)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          dist\bin\jdh.exe new project DataFileGame; if ($LASTEXITCODE) { exit 1 }
          Copy-Item tests\fixtures\datafile-main.jb DataFileGame\main.jb -Force
          dist\bin\jdh.exe build exe DataFileGame -o DataFile.exe; if ($LASTEXITCODE) { exit 1 }
          $env:SDL_VIDEODRIVER = 'dummy'; $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process .\DataFile.exe -RedirectStandardOutput datafile-out.txt -RedirectStandardError datafile-err.txt -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error '1분 안에 끝나지 않았습니다'; exit 1 }
          Get-Content datafile-out.txt -Encoding utf8; Get-Content datafile-err.txt -Encoding utf8
          $expect = @('part=Hello', 'set=Hello, JB', 'ins=>Hello, JB!', 'empty=[]', 'num=3e406fe000000000006c6c6f2c204a4221', 'k=255', 'cow=Xbc abZ', 'file=line2')
          $got = Get-Content datafile-out.txt -Encoding utf8; $bad = 0
          foreach ($e in $expect) { if ($got -notcontains $e) { Write-Host "✖ 없음: $e"; $bad++ } }
          if ($bad) { exit 1 }
      - name: run.bat 시험 (jdh new project 가 만든 run.bat → jdh run · 처음엔 컴파일 · 두 번째는 실행기를 다시 씀)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''; $env:PATH = "$PWD\dist\bin;$env:PATH"
          dist\bin\jdh.exe new project RunGame; if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path RunGame\run.bat)) { Write-Error 'run.bat 이 없습니다'; exit 1 }
          Set-Content RunGame\main.jb "Use jawbreaker call jaw;`r`n`r`nrun{`r`n    print(`"run ok 1`");`r`n}`r`n" -Encoding utf8
          $o1 = cmd /c "RunGame\run.bat < nul" 2>&1 | Out-String; Write-Host $o1
          if ($o1 -notmatch 'run ok 1') { Write-Error 'run.bat 이 main 을 실행하지 않았습니다'; exit 1 }
          Set-Content RunGame\main.jb "Use jawbreaker call jaw;`r`n`r`nrun{`r`n    print(`"run ok 2`");`r`n}`r`n" -Encoding utf8
          $t = Measure-Command { $script:o2 = cmd /c "RunGame\run.bat < nul" 2>&1 | Out-String }; Write-Host $o2; Write-Host "두 번째: $([int]$t.TotalSeconds)초"
          if ($o2 -notmatch 'run ok 2') { Write-Error '고친 main 이 실행되지 않았습니다'; exit 1 }
          if ($o2 -notmatch '실행기는 그대로') { Write-Error '두 번째에도 실행기를 다시 컴파일했습니다'; exit 1 }
      - name: APK 시험 (jdh build apk — Android SDK 의 apksigner 로 서명 v2 검사 · aapt 로 manifest 확인 · 서명 키는 CNG 로 만든 PKCS#8)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''; $env:JDH_APK_KEY = "$PWD\apk-key-test.json"
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          dist\bin\jdh.exe new project ApkGame; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe build apk ApkGame -o ApkGame.apk --label '시험 게임' --pkg com.jawbreaker.citest --version-code 5 --version-name 1.5 --orientation landscape; if ($LASTEXITCODE) { exit 1 }
          dist\bin\jdh.exe build apk ApkGame -o ApkGame2.apk; if ($LASTEXITCODE) { exit 1 }
          $bt = (Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object { [version]($_.Name -replace '[^0-9.]', '') } | Select-Object -Last 1).FullName
          Write-Host "build-tools: $bt"
          $v = & "$bt\apksigner.bat" verify --verbose --min-sdk-version 24 ApkGame.apk 2>&1; $v | ForEach-Object { Write-Host "  $_" }
          $bad = 0
          if (-not ($v | Where-Object { "$_" -match 'Verified using v2 scheme \(APK Signature Scheme v2\): true' })) { Write-Host '✖ 서명 v2 검사 실패'; $bad++ }
          $bd = & "$bt\aapt.exe" dump badging ApkGame.apk 2>&1; $bd | Select-Object -First 8 | ForEach-Object { Write-Host "  $_" }
          if (-not ($bd | Where-Object { "$_" -match "package: name='com.jawbreaker.citest' versionCode='5' versionName='1.5'" })) { Write-Host '✖ manifest (패키지 · 버전) 가 다릅니다'; $bad++ }
          if (-not ($bd | Where-Object { "$_" -match "application-label:'시험 게임'" })) { Write-Host '✖ 앱 이름이 다릅니다'; $bad++ }
          & "$bt\apksigner.bat" verify ApkGame2.apk; if ($LASTEXITCODE) { Write-Host '✖ 두 번째 APK (같은 키) 서명 검사 실패'; $bad++ }
          # 서명 키 = PKCS#8 (웹 판의 키 파일과 같은 꼴: SEQ · INTEGER 0 · SEQ { rsaEncryption })
          $k = Get-Content apk-key-test.json -Raw | ConvertFrom-Json; $p8 = [Convert]::FromBase64String($k.pkcs8)
          $hex = ($p8[0..25] | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "pkcs8: $hex"
          if ($hex -notmatch '^3082....020100300d06092a864886f70d0101010500') { Write-Host '✖ 서명 키가 PKCS#8 이 아닙니다'; $bad++ }
          if ($bad) { exit 1 }
      - name: JawBreaker Dev. 시험 (네이티브 에디터 — 프로젝트를 열고 ▶ 실행 (run.bat) · 로그 칸에 출력 · 창 그림)
        shell: pwsh
        run: |
          $env:JDH_HOME = ''; $env:JDH_LANG = 'ko'
          $p = Start-Process dist\bin\jbdev.exe -ArgumentList '--selftest', "$PWD\RunGame", "$PWD\jbdev-shot" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error '3분 안에 끝나지 않았습니다'; exit 1 }
          Write-Host "종료 코드: $($p.ExitCode)"
          if (-not (Test-Path jbdev-shot.log)) { Write-Error '로그를 남기지 않았습니다 (프로젝트를 열지 못함?)'; exit 1 }
          Get-Content jbdev-shot.log -Encoding utf8
          $bad = 0
          foreach ($e in @('검사 통과', 'run ok 2', '[selftest] tabs=2')) { if (-not (Select-String -Path jbdev-shot.log -SimpleMatch $e -Quiet -Encoding utf8)) { Write-Host "✖ 로그에 없음: $e"; $bad++ } }
          if (-not (Select-String -Path jbdev-shot.log -Pattern 'natdir=.+ docs=7 ac=[1-9]' -Quiet -Encoding utf8)) { Write-Host '✖ 설명서 · 자동완성 목록을 찾지 못했습니다'; $bad++ }
          if (-not (Select-String -Path jbdev-shot.log -Pattern 'ac items=[1-9][0-9]* first=' -Quiet -Encoding utf8)) { Write-Host '✖ jaw. 자동완성 목록이 뜨지 않았습니다'; $bad++ }
          if (-not (Select-String -Path jbdev-shot.log -Pattern 'doc jawbreaker.jbl lines=[1-9][0-9]+ ro=1' -Quiet -Encoding utf8)) { Write-Host '✖ 내장 설명서를 읽기 전용으로 열지 못했습니다'; $bad++ }
          if (-not (Test-Path RunGame\RunGame.html)) { Write-Host '✖ HTML 만들기 결과가 없습니다'; $bad++ } elseif (-not (Select-String -Path RunGame\RunGame.html -SimpleMatch 'run ok 2' -Quiet -Encoding utf8)) { Write-Host '✖ HTML 에 프로젝트가 들어가지 않았습니다'; $bad++ }
          if (-not (Test-Path RunGame\RunGame.apk)) { Write-Host '✖ APK 만들기 결과가 없습니다 (☰ → APK 로 변환)'; $bad++ }
          if (-not (Select-String -Path jbdev-shot.log -Pattern '\[selftest\] ui=(color|mono) lang=ko' -Quiet -Encoding utf8)) { Write-Host '✖ 설정 창 · APK 창을 그리지 못했습니다'; $bad++ }
          foreach ($f in @('jbdev-shot-set.bmp', 'jbdev-shot-apk.bmp')) { if (-not (Test-Path $f)) { Write-Host "✖ 창 그림이 없습니다: $f"; $bad++ } }
          if ($bad) { exit 1 }
          if (-not (Test-Path jbdev-shot.bmp)) { Write-Error '창 그림이 없습니다'; exit 1 }
          Write-Host "창 그림: $((Get-Item jbdev-shot.bmp).Length) 바이트"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JDH-test-screens
          path: |
            jbdev-shot*.png
            jbdev-shot*.bmp
            probe-exe.png
            layers-exe.png
          if-no-files-found: ignore
      - name: 업데이트 파일 만들기 (설치된 파일 목록 · 묶음) · 업데이트 시험
        shell: pwsh
        run: |
          $env:JDH_HOME = ''
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $ver = (dist\bin\jdh.exe version).Split(' ')[1]
          if (Test-Path dist\jdh-manifest.txt) { Remove-Item dist\jdh-manifest.txt }
          dist\bin\jdh.exe pack-update dist upd $ver; if ($LASTEXITCODE) { exit 1 }
          # 시험: 지금 것을 "설치본" 으로 복사해 몇 파일을 망가뜨리고, 가짜 새 버전 (99.0.0) 으로 업데이트 — HTTP (Range) 로 받음
          dist\bin\jdh.exe pack-update dist upd99 99.0.0; if ($LASTEXITCODE) { exit 1 }
          Copy-Item upd\jdh-manifest.txt dist\jdh-manifest.txt
          robocopy dist inst /e /nfl /ndl /njh /njs /np | Out-Null
          $zf = (Get-ChildItem inst\toolchain\zig\lib -File -Recurse | Select-Object -First 1).FullName
          $touched = @("$PWD\inst\editor\jbdev.html", "$PWD\inst\bin\jdh.exe", "$PWD\inst\bin\jbdev.exe", $zf)
          foreach ($f in $touched) { Add-Content -Path $f -Value 'x' -NoNewline -Encoding ascii }
          Remove-Item inst\sdk\jdh.h
          $srv = Start-Process python -ArgumentList 'tests\range_server.py','upd99','8765' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $bad = 0
          try {
            $env:JDH_UPDATE_URL = 'http://127.0.0.1:8765'
            $out = inst\bin\jdh.exe update --check
            if ($LASTEXITCODE -ne 10 -or "$out".Trim() -ne '99.0.0') { Write-Host "✖ 새 버전을 알아보지 못했습니다 (exit=$LASTEXITCODE · $out)"; $bad++ }
            inst\bin\jdh.exe update --yes; if ($LASTEXITCODE) { Write-Host '✖ 업데이트 실패'; $bad++ }
            foreach ($f in $touched + "$PWD\inst\sdk\jdh.h") {
              $o = $f.Replace("$PWD\inst\", "$PWD\dist\")
              if (-not (Test-Path $f) -or (Get-FileHash $f).Hash -ne (Get-FileHash $o).Hash) { Write-Host "✖ 새 버전과 다릅니다: $f"; $bad++ }
            }
            # 다시 돌리면: 모든 파일을 검사해 "온전" 이라고 해야 함 · 쓰는 중이라 못 지웠던 옛 실행 파일도 정리
            $again = inst\bin\jdh.exe update --yes; Write-Host $again
            if ("$again" -notmatch '모두 온전') { Write-Host '✖ 업데이트 뒤 검사에서 다른 파일이 남았습니다'; $bad++ }
            inst\bin\jdh.exe update --check | Out-Null
            if (Get-ChildItem inst -Recurse -Force | Where-Object { $_.Name -like '*.old-jdh' -or $_.Name -eq '.jdh-update' }) { Write-Host '✖ 임시 파일이 남았습니다'; $bad++ }
            # 받는 도중 손상: 묶음을 망가뜨리면 아무것도 바꾸지 않아야 함
            Set-Content inst\sdk\jdh.h -Value 'junk' -NoNewline -Encoding ascii
              $len = (Get-Item upd99\jdh-core.pack).Length; [IO.File]::WriteAllBytes("$PWD\upd99\jdh-core.pack", (New-Object byte[] $len))
            inst\bin\jdh.exe update --yes
            if ($LASTEXITCODE -eq 0 -or (Get-Content inst\sdk\jdh.h -Raw) -ne 'junk') { Write-Host '✖ 손상된 묶음인데 파일을 바꿨습니다'; $bad++ }
            # 실제 주소 (GitHub 릴리스): 확인만 — 릴리스가 없거나 닿지 못해도 조용히 0
            $env:JDH_UPDATE_URL = ''
            $real = inst\bin\jdh.exe update --check; Write-Host "실제 주소 확인: exit=$LASTEXITCODE $real"
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 10) { Write-Host '✖ 실제 주소 확인이 비정상 종료'; $bad++ }
          } finally { Stop-Process -Id $srv.Id -Force }
          if ($bad) { exit 1 }
      - name: 설치 파일 만들기
        shell: cmd
        run: |
          where iscc >nul 2>nul || choco install innosetup -y --no-progress
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\jdh.iss
      - uses: actions/upload-artifact@v4
        with:
          name: JDH-Setup
          path: installer/out/*.exe
      - name: 릴리스 게시 (버전 태그를 올렸을 때만 — 설치 파일 · 업데이트 파일)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:JDH_HOME = ''
          $ver = (dist\bin\jdh.exe version).Split(' ')[1]
          if ($env:GITHUB_REF_NAME -ne "v$ver") { Write-Error "태그 ($env:GITHUB_REF_NAME) 와 jdh 의 버전 (v$ver) 이 다릅니다"; exit 1 }
          # 웹에서 릴리스를 먼저 만들었으면 (태그와 함께) 거기에 파일을 올리고, 태그만 올렸으면 릴리스를 만듦
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME "installer\out\JDH-Setup-$ver.exe" upd\jdh-latest.txt upd\jdh-manifest.txt upd\jdh-core.pack upd\jdh-zig.pack --clobber }
          else { gh release create $env:GITHUB_REF_NAME "installer\out\JDH-Setup-$ver.exe" upd\jdh-latest.txt upd\jdh-manifest.txt upd\jdh-core.pack upd\jdh-zig.pack --title "JDH $ver" --notes "JDH $ver — 처음 설치는 JDH-Setup-$ver.exe · 이미 설치했다면 JawBreaker Dev. 를 열 때 업데이트를 묻습니다 (또는 jdh update)." }
          if ($LASTEXITCODE) { exit 1 }
      - name: 창 그림 (PNG 를 base64 로 로그에 — 내려받지 않고 볼 수 있게)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path jbdev-shot.log) { Get-Content jbdev-shot.log -Encoding utf8 | Select-Object -Last 30 }
          Add-Type -AssemblyName System.Drawing
          foreach ($n in @('jbdev-shot', 'jbdev-shot-ac', 'jbdev-shot-set', 'jbdev-shot-apk')) {
            if (-not (Test-Path "$n.bmp")) { continue }
            $img = [System.Drawing.Image]::FromFile("$PWD\$n.bmp"); $img.Save("$PWD\$n.png", [System.Drawing.Imaging.ImageFormat]::Png); $img.Dispose()
            $s = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\$n.png")); Write-Host "SHOT $n $($s.Length)"
            for ($i = 0; $i -lt $s.Length; $i += 8000) { Write-Host ("SHOTL $n " + $s.Substring($i, [Math]::Min(8000, $s.Length - $i))) }
          }
